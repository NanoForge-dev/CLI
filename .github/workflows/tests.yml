name: Tests

on:
  pull_request:
    branches:
      - main
  # Pushes to main fill the caches that pull requests restore.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: nanoforge-dev/actions/.github/workflows/tests.yml@v3
    with:
      style-scripts: '["repo:lint"]'
      unit-script: repo:test:unit
      e2e-script: repo:test:e2e
