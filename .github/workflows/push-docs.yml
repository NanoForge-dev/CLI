name: synchronize-docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: setup git
        run: |
          git config user.name "Github Action Bot"
          git config user.email "<>"

      - name: synchronize docs
        run: |
          mkdir temp
          cd temp
          git clone git@github.com:NanoForge-dev/docs.git
          cp ../docs docs/cli
          cd docs
          git push origin main
